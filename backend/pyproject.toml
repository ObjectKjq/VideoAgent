[project]
name = "backend"
version = "0.0.1"
description = "AI 视频生成器 - Python 后端"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "python-multipart==0.0.12", # 文件上传支持
    "sqlalchemy==2.0.36",
    "pymysql==1.1.1",
    "cryptography==43.0.3", # 加密安全库
    "databases[mysql]==0.9.0", # 异步数据库连接库
    "pydantic==2.10.2", # 数据验证库，检查请求参数格式是否正确、自动转换类型
    "pydantic-settings==2.6.1", # 用来读取 .env 环境变量
    "python-dotenv==1.0.1", # 加载 .env 文件
    "passlib[bcrypt]==1.7.4", # 专门用来加密用户密码
    "python-dateutil==2.9.0.post0", # 日期时间工具
]



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]